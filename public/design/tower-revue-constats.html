<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower — Revue des constats</title>
<style>
/* ============================================================
   TOKENS — thème clair et sombre définis explicitement.
   Contraste vérifié AA sur toutes les paires texte/fond.
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg-sunken:#fafafa;
  --surface:#ffffff;
  --surface-hover:#f4f5f8;
  --surface-sel:#eceef5;
  --border:#e4e5e9;
  --border-strong:#d0d2d8;
  --text:#0d0e10;      /* 19.2:1 sur --bg */
  --text-2:#3d3f45;    /* 10.5:1 sur --bg */
  --text-3:#5f6168;    /* 5.7:1  sur --bg, 4.7:1 sur la ligne sélectionnée */
  --accent:#4f5ac6;    /* 5.8:1  sur --bg */
  --accent-fg:#ffffff; /* 5.8:1  sur --accent */
  --accent-soft:#eceef8;
  /* La capture est une photo du site réel : elle garde ses couleurs
     dans les deux thèmes. Une preuve qui s'inverse n'est plus une preuve. */
  --shot-page:#ffffff;
  --shot-ink:#1b1c1f;
  --shot-mut:#83868e;
  --shot-line:#e3e4e8;
  --shot-fill:#eceef1;
  --shot-frame:#f1f2f4;
  --dim:rgba(12,13,16,.38);
  --shot-edge:#d0d2d8;
  --shadow:0 1px 2px rgba(13,14,16,.06),0 8px 24px rgba(13,14,16,.08);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
}
:root[data-theme="dark"]{
  --bg:#08090a;
  --bg-sunken:#0b0c0d;
  --surface:#101112;
  --surface-hover:#17181a;
  --surface-sel:#1d1e21;
  --border:#1e2023;
  --border-strong:#2c2e33;
  --text:#f7f8f8;      /* 18.4:1 sur --bg */
  --text-2:#a2a5ad;    /* 8.6:1  sur --bg */
  --text-3:#8a8f98;    /* 6.1:1  sur --bg */
  --accent:#7c86e8;    /* 6.1:1  sur --bg */
  --accent-fg:#08090a; /* 6.4:1  sur --accent */
  --accent-soft:#171a2e;
  --dim:rgba(6,7,8,.46);
  --shot-edge:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.45);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05" 1,"ss01" 1;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:5px}
::selection{background:var(--accent);color:var(--accent-fg)}
kbd{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:10px;line-height:15px;display:inline-block;min-width:16px;
  padding:0 4px;text-align:center;border:1px solid var(--border-strong);
  border-bottom-width:2px;border-radius:4px;color:var(--text-3);
  background:var(--surface);vertical-align:middle;
}

/* ============================================================
   COQUE
   ============================================================ */
.app{display:flex;flex-direction:column;height:100vh;min-height:0}

/* --- Sélecteur d'état (outil de maquette, pas de produit) --- */
/* Cibles : tous les contrôles secondaires ont une zone cliquable de 44 px
   de haut ; seul le fond visible reste compact, pour tenir la densité. */
.hit{
  height:44px;flex:none;display:inline-flex;align-items:center;
  padding:0 2px;border-radius:6px;
}
.hit>span{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;
  border-radius:5px;font-size:12px;color:var(--text-3);white-space:nowrap;
}
.hit:hover>span{background:var(--surface-hover);color:var(--text)}
.hit[aria-pressed="true"]>span{background:var(--surface-sel);color:var(--text);font-weight:500}

.states{
  display:flex;align-items:center;gap:10px;flex:none;
  padding:0 14px;height:48px;background:var(--bg-sunken);
  border-bottom:1px solid var(--border);
}
.states__label{
  font-size:11px;color:var(--text-3);letter-spacing:.02em;
  flex:none;padding-right:4px;border-right:1px solid var(--border);height:18px;line-height:18px;
}
.states__list{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.states__list::-webkit-scrollbar{display:none}
.chip>span{color:var(--text-2)}
.states__right{display:flex;align-items:center;gap:1px;flex:none}

/* --- Barre de run --- */
.runbar{flex:none;border-bottom:1px solid var(--border);background:var(--bg)}
.runbar__main{display:flex;align-items:center;gap:0;height:48px;padding:0 16px}
.runbar__title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-right:12px;white-space:nowrap}
.meta{display:flex;align-items:center;gap:0;min-width:0;overflow:hidden}
.meta span{font-size:12px;color:var(--text-2);white-space:nowrap}
.meta span+span::before{content:"·";margin:0 8px;color:var(--border-strong)}
.runbar__spacer{flex:1}
.counts{display:flex;align-items:center;gap:10px;flex:none}
.counts__text{font-size:12px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.counts__text b{color:var(--text);font-weight:600}
.bar{width:96px;height:3px;border-radius:2px;background:var(--border);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--text-3);border-radius:2px;transition:width .25s ease}

/* pastille "en cours" */
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.live i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}

/* bandeau d'avertissement — calme, pas alarmant */
.notice{
  display:flex;align-items:flex-start;gap:10px;padding:10px 16px;
  border-top:1px solid var(--border);background:var(--bg-sunken);
}
.notice__mark{
  flex:none;margin-top:1px;width:16px;height:16px;border-radius:4px;
  border:1px solid var(--border-strong);color:var(--text-2);
  font-size:11px;line-height:14px;text-align:center;font-weight:600;
}
.notice__body{font-size:12px;color:var(--text-2);max-width:88ch}
.notice__body b{color:var(--text);font-weight:600}
.notice__more{
  color:var(--text);text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--border-strong);
  padding:13px 0;margin:-13px 0; /* 44 px de zone cliquable, zéro décalage */
}
.notice__more:hover{text-decoration-color:var(--text-3)}
.coverage{display:none;padding:0 16px 12px 42px}
.coverage[data-open="true"]{display:block}
.coverage ul{margin:0;padding:0;list-style:none;columns:3;column-gap:24px}
.coverage li{font-size:12px;color:var(--text-3);padding:2px 0;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}

/* ============================================================
   ESPACE DE TRAVAIL — 3 colonnes : file / preuve / verdict
   ============================================================ */
.workspace{flex:1;display:grid;grid-template-columns:340px minmax(0,1fr) 372px;min-height:0}
.col{min-height:0;display:flex;flex-direction:column}
.queue{border-right:1px solid var(--border);background:var(--bg-sunken)}
.evidence{background:var(--bg)}
.verdict{border-left:1px solid var(--border);background:var(--bg)}

/* --- File --- */
.queue__head{
  flex:none;display:flex;align-items:center;gap:1px;height:44px;padding:0 8px 0 10px;
  border-bottom:1px solid var(--border);
}
.filter b{font-variant-numeric:tabular-nums;font-weight:inherit;color:var(--text-2)}
.filter[aria-pressed="true"] b{color:var(--text)}
.queue__list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 32px}
.queue__list:focus-visible{box-shadow:inset var(--ring)}

.row{
  display:block;width:100%;text-align:left;position:relative;
  padding:9px 12px 10px 14px;border-bottom:1px solid var(--border);
  min-height:44px;
}
.row::before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:2px;background:transparent}
.row:hover{background:var(--surface-hover)}
.row[aria-selected="true"]{background:var(--surface-sel)}
.row[aria-selected="true"]::before{background:var(--text)}
.row:focus-visible{box-shadow:inset var(--ring)}
.row__top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.row__cat{
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  font-weight:500;white-space:nowrap;flex:none;
}
.row__flags{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.flag{
  font-size:10px;line-height:15px;padding:0 5px;border-radius:4px;
  border:1px solid var(--border-strong);color:var(--text-2);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.flag--quiet{border-color:transparent;color:var(--text-3);padding:0}
.row__zone{
  font-size:13px;color:var(--text);font-weight:500;letter-spacing:-.005em;
  display:block;margin-bottom:2px;
}
.row[data-statut="bruit"] .row__zone,.row[data-statut="exporte"] .row__zone{color:var(--text-2);font-weight:400}
.row__obs{
  font-size:12px;color:var(--text-3);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.row__url{
  font-size:11px;color:var(--text-3);margin-top:3px;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;
}
.row--new{animation:slideIn .32s cubic-bezier(.2,.8,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.row--new{animation:none}}

.queue__pending{display:flex;align-items:center;gap:10px;padding:14px 14px}
.skel{flex:1;height:8px;border-radius:4px;background:var(--border);animation:shim 1.6s ease-in-out infinite}
.skel:nth-child(2){max-width:38%}
@keyframes shim{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.queue__end{padding:14px 14px 0;font-size:11px;color:var(--text-3)}

/* --- Preuve : la capture est le contenu principal --- */
.evidence__head{
  flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 16px;
  border-bottom:1px solid var(--border);
}
.evidence__url{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;
}
.evidence__stage{
  flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;
  padding:16px;background:var(--bg-sunken);overflow:hidden;
}
.shot{
  height:100%;max-width:100%;border-radius:7px;overflow:hidden;
  border:1px solid var(--shot-edge);box-shadow:var(--shadow);background:var(--shot-frame);
  display:block;cursor:zoom-out;
}
.shot svg{display:block;height:100%;width:auto;max-width:100%}
.shot[data-dim="off"]{cursor:zoom-in}
.shot[data-dim="off"] .dimmer{opacity:0}
.dimmer{transition:opacity .18s ease}
@media (prefers-reduced-motion:reduce){.dimmer{transition:none}}

/* --- Verdict --- */
.verdict__scroll{flex:1;overflow-y:auto;padding:16px 18px 8px;min-height:0}
.eyebrow{
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  font-weight:500;margin:0 0 6px;
}
.obs{font-size:14px;line-height:1.58;color:var(--text);margin:0 0 16px;letter-spacing:-.005em}
.impact{font-size:13px;line-height:1.55;color:var(--text-2);margin:0 0 16px}
.facts{border-top:1px solid var(--border);padding-top:12px;margin-top:2px}
.fact{display:flex;gap:12px;padding:3px 0;font-size:12px}
.fact dt{flex:none;width:74px;color:var(--text-3)}
.fact dd{margin:0;color:var(--text-2);min-width:0;word-break:break-word}
.fact dd b{color:var(--text);font-weight:500}

.persist{
  border:1px solid var(--border-strong);border-radius:6px;padding:10px 12px;margin:0 0 16px;
  background:var(--bg-sunken);
}
.persist__t{font-size:12px;font-weight:600;color:var(--text);margin:0 0 4px}
.persist__d{font-size:12px;color:var(--text-2);margin:0}
.runs{display:flex;gap:6px;margin-top:8px}
.runs span{
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-2);
  border:1px solid var(--border-strong);border-radius:4px;padding:1px 6px;
}
.runs span:first-child{color:var(--text);border-color:var(--text-3)}

.resolved{
  border:1px solid var(--border);border-radius:6px;padding:12px;margin:0 0 16px;background:var(--bg-sunken);
}
.resolved__t{font-size:12px;font-weight:600;margin:0 0 4px;color:var(--text)}
.resolved__d{font-size:12px;color:var(--text-2);margin:0}
.linear{
  display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--border);
}
.linear__id{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--text);font-weight:500;
}
.linear__state{font-size:11px;color:var(--text-2);border:1px solid var(--border-strong);border-radius:4px;padding:1px 6px}
.linear__link{
  margin-left:auto;font-size:12px;color:var(--text);text-decoration:underline;
  text-underline-offset:2px;text-decoration-color:var(--border-strong);
  display:inline-flex;align-items:center;height:44px;margin-top:-13px;margin-bottom:-13px;
}
.linear__link:hover{text-decoration-color:var(--text-3)}

/* --- Barre de jugement : un geste = une touche --- */
.judge{
  flex:none;border-top:1px solid var(--border);padding:10px 14px;
  display:flex;gap:8px;background:var(--bg);
}
.btn{
  height:44px;flex:1;border-radius:6px;border:1px solid var(--border-strong);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:13px;font-weight:500;color:var(--text);background:var(--surface);min-width:0;
}
.btn:hover{background:var(--surface-hover)}
.btn:active{transform:translateY(.5px)}
.btn small{font-size:10px;color:var(--text-3);font-weight:400}
.btn--go{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);flex:1.25}
.btn--go small{color:var(--accent-fg);opacity:.8}
.btn--go:hover{background:var(--accent);filter:brightness(1.08)}
.btn--wide{flex:1}
.btn[disabled]{opacity:.45;cursor:default}
.judge--single{padding:10px 14px}

/* --- Toast d'annulation --- */
.toast{
  position:fixed;left:16px;bottom:16px;z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:9px 10px 9px 14px;border-radius:7px;
  background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow);
  font-size:12px;color:var(--text);
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .16s ease,transform .16s ease;
}
.toast[data-open="true"]{opacity:1;transform:none;pointer-events:auto}
.toast button{height:44px;display:inline-flex;align-items:center;padding:0}
.toast button>span{
  height:28px;padding:0 9px;border-radius:5px;border:1px solid var(--border-strong);
  font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--text);
}
.toast button:hover>span{background:var(--surface-hover)}

/* --- États vides --- */
.blank{
  grid-column:1/-1;display:flex;align-items:flex-start;justify-content:center;
  padding:64px 24px 24px;min-height:0;overflow-y:auto;
}
.blank__box{max-width:560px;width:100%}
.blank__t{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px}
.blank__d{font-size:13px;line-height:1.6;color:var(--text-2);margin:0 0 20px;max-width:56ch}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.steps li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.steps .n{
  flex:none;width:18px;height:18px;border-radius:5px;border:1px solid var(--border-strong);
  font-size:11px;line-height:16px;text-align:center;color:var(--text-3);margin-top:1px;
}
.steps .done{border-color:transparent;background:var(--surface-sel);color:var(--text)}
.steps b{font-weight:500;display:block;color:var(--text)}
.steps p{margin:2px 0 0;color:var(--text-2);font-size:12px;line-height:1.5}
.blank__foot{margin-top:20px;font-size:12px;color:var(--text-3);display:flex;gap:10px;align-items:center}

/* --- Aide clavier --- */
.help{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:var(--dim)}
.help[data-open="true"]{display:flex}
.help__box{
  width:340px;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:9px;box-shadow:var(--shadow);padding:14px 16px 16px;
}
.help__t{font-size:13px;font-weight:600;margin:0 0 10px}
.help dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:7px 12px;align-items:center}
.help dt{font-size:12px;color:var(--text-2)}
.help dd{margin:0;text-align:right;display:flex;gap:4px;justify-content:flex-end}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================
   TABLETTE — la colonne verdict passe sous la preuve
   ============================================================ */
@media (max-width:1180px){
  .workspace{grid-template-columns:296px minmax(0,1fr)}
  .verdict{
    grid-column:2;grid-row:2;border-left:none;border-top:1px solid var(--border);
    max-height:44vh;
  }
  .evidence{grid-column:2;grid-row:1;min-height:0}
  .queue{grid-row:1/span 2}
  .workspace{grid-template-rows:minmax(0,1fr) auto}
  .verdict__scroll{padding:12px 14px 6px}
  .obs{font-size:13px;margin-bottom:12px}
  .blank{grid-column:1/-1;grid-row:1/span 2}
}
@media (max-width:820px){
  .workspace{grid-template-columns:minmax(0,1fr)}
  .queue{grid-row:1;grid-column:1;border-right:none;border-bottom:1px solid var(--border);max-height:34vh}
  .evidence{grid-row:2;grid-column:1}
  .verdict{grid-row:3;grid-column:1}
  .workspace{grid-template-rows:auto minmax(0,1fr) auto}
}
</style>
</head>
<body>

<div class="app">

  <!-- Sélecteur d'état de la maquette -->
  <div class="states" role="group" aria-label="État de la maquette">
    <span class="states__label">État</span>
    <div class="states__list" id="states"></div>
    <div class="states__right">
      <button class="hit iconbtn" id="help-btn" aria-haspopup="dialog"><span><kbd>?</kbd> Raccourcis</span></button>
      <button class="hit iconbtn" id="theme-btn" aria-label="Basculer le thème"><span id="theme-lbl">Clair</span></button>
    </div>
  </div>

  <!-- Barre de run -->
  <div class="runbar">
    <div class="runbar__main">
      <span class="runbar__title" id="run-title">Run 12</span>
      <div class="meta" id="run-meta"></div>
      <div class="runbar__spacer"></div>
      <div class="counts" id="run-counts"></div>
    </div>
    <div id="run-notice"></div>
  </div>

  <!-- Espace de travail -->
  <main class="workspace" id="workspace"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-text"></span>
  <button id="toast-undo"><span>Annuler <kbd>U</kbd></span></button>
</div>

<div class="help" id="help" role="dialog" aria-modal="true" aria-label="Raccourcis clavier">
  <div class="help__box">
    <p class="help__t">Raccourcis</p>
    <dl>
      <dt>Constat suivant / précédent</dt><dd><kbd>J</kbd><kbd>K</kbd></dd>
      <dt>Actionnable</dt><dd><kbd>A</kbd></dd>
      <dt>Bruit</dt><dd><kbd>B</kbd></dd>
      <dt>Exporter vers Linear</dt><dd><kbd>E</kbd></dd>
      <dt>Annuler le dernier jugement</dt><dd><kbd>U</kbd></dd>
      <dt>Afficher tout / à juger</dt><dd><kbd>F</kbd></dd>
      <dt>Capture sans surlignage</dt><dd><kbd>S</kbd></dd>
      <dt>Fermer</dt><dd><kbd>Esc</kbd></dd>
    </dl>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   DONNÉES — boutique fictive alpinia.ch, contenu réel en prose.
   Aucune métrique inventée : impact_estime est du texte.
   ============================================================ */

const SHOP = "www.alpinia.ch";

/* Descripteurs de capture : type de page + zone surlignée (en %) */
const SHOTS = {

/* ============================================================
   CAPTURES — SVG généré, aucune ressource externe.
   Rendu volontairement sobre : c'est une preuve, pas une image.
   ============================================================ */
const W = 900, H = 1180;

function px(v,total){return v*total/100}

function chrome(url){
  return `
  <rect x="0" y="0" width="${W}" height="52" fill="var(--shot-frame)"/>
  <circle cx="24" cy="26" r="5" fill="var(--shot-line)"/>
  <circle cx="42" cy="26" r="5" fill="var(--shot-line)"/>
  <circle cx="60" cy="26" r="5" fill="var(--shot-line)"/>
  <rect x="84" y="13" width="${W-108}" height="26" rx="6" fill="var(--shot-page)" stroke="var(--shot-line)"/>
  <text x="98" y="30" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="var(--shot-mut)">${esc(url)}</text>
  <line x1="0" y1="52" x2="${W}" y2="52" stroke="var(--shot-line)"/>`;
}

function siteHeader(y){
  return `
  <text x="36" y="${y+30}" font-family="Inter,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="var(--shot-ink)">ALPINIA</text>
  ${["Vestes","Chaussures","Sacs","Accessoires","Nouveautés"].map((t,i)=>
    `<text x="${300+i*108}" y="${y+30}" font-family="Inter,sans-serif" font-size="13" fill="var(--shot-mut)">${t}</text>`).join("")}
  <circle cx="${W-52}" cy="${y+24}" r="9" fill="none" stroke="var(--shot-mut)" stroke-width="1.5"/>
  <line x1="0" y1="${y+58}" x2="${W}" y2="${y+58}" stroke="var(--shot-line)"/>`;
}

function lines(x,y,w,n,gap,c){
  let s="";
  for(let i=0;i<n;i++){
    const ww = i===n-1 ? w*0.62 : w*(0.86+((i*37)%14)/100);
    s+=`<rect x="${x}" y="${y+i*gap}" width="${ww}" height="7" rx="3.5" fill="${c||"var(--shot-line)"}"/>`;
  }
  return s;
}

function jacket(x,y,w,h){
  const cx=x+w/2;
  return `

/* ============================================================
   ÉTAT DE L'APPLICATION
   ============================================================ */
let state = "recurrent";
let items = [];
let sel = 0;
let onlyTodo = true;
let dim = true;
let lastAction = null;
let liveTimer = null;
let liveIdx = 0;

const $ = s => document.querySelector(s);
const el = (t,c,h) => {const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};

function clone(a){return a.map(o=>({...o}))}

function visible(){ return onlyTodo ? items.filter(f=>f.statut==="a_juger") : items; }
function current(){ const v=visible(); return v[Math.min(sel, v.length-1)] || items[0] || null; }

/* ============================================================
   RENDU
   ============================================================ */
function renderStates(){
  const box = $("#states"); box.innerHTML="";
  STATES.forEach(s=>{
    const b = el("button","hit chip","<span>"+s.label+"</span>");
    b.setAttribute("aria-pressed", String(state===s.key));
    b.onclick = ()=>setState(s.key);
    box.appendChild(b);
  });
}

function runOf(){
  if(state==="vide") return null;
  if(state==="encours") return RUNS.encours;
  if(state==="interrompu") return RUNS.interrompu;
  return RUNS.revue;
}

function renderRunbar(){
  const r = runOf();
  const meta = $("#run-meta"), counts = $("#run-counts"), notice = $("#run-notice");
  meta.innerHTML=""; counts.innerHTML=""; notice.innerHTML="";

  if(!r){
    $("#run-title").textContent = "alpinia.ch";
    meta.appendChild(el("span",null,"Aucun run terminé"));
    return;
  }
  $("#run-title").textContent = "Run " + r.n;
  [r.date, r.agent, "Persona : " + r.persona].forEach(t=>meta.appendChild(el("span",null,esc(t))));

  const judged = items.filter(f=>f.statut!=="a_juger").length;
  if(r.live){
    counts.appendChild(el("div","live",'<i></i>'+items.length+" constats · page "+
      Math.min(r.pages[0]+liveIdx,r.pages[1])+" sur "+r.pages[1]));
  }else{
    counts.appendChild(el("span","counts__text","<b>"+judged+"</b> jugés sur "+items.length));
    const bar = el("div","bar"); bar.innerHTML='<i style="width:'+(items.length?judged/items.length*100:0)+'%"></i>';
    counts.appendChild(bar);
  }

  if(r.stopped){
    const n = el("div","notice");
    n.innerHTML =
      '<span class="notice__mark" aria-hidden="true">!</span>'+
      '<p class="notice__body"><b>Run arrêté au plafond de budget.</b> '+r.pages[0]+' pages parcourues sur les '+r.pages[1]+
      ' prévues. Les '+items.length+' constats ci-dessous ont été vérifiés et sont exploitables ; les '+
      (r.pages[1]-r.pages[0])+' pages restantes n\'ont pas été visitées et seront reprises en tête du prochain run. '+
      '<button class="notice__more" id="cov-btn" aria-expanded="false">Voir les pages non parcourues</button></p>';
    notice.appendChild(n);
    const cov = el("div","coverage");
    cov.innerHTML = "<ul>"+["/produits/doudoune-cirrus","/produits/polaire-grid","/produits/pantalon-mixte",
      "/produits/bonnet-laine","/produits/lampe-frontale","/produits/gourde-1l","/produits/batons-carbone",
      "/collections/doudounes","/collections/chaussures","/collections/soldes","/collections/accessoires",
      "/compte/connexion","/compte/commandes","/contact","/guide-des-tailles","/marques/alpinia",
      "/blog/entretien-membrane","/cartes-cadeaux","/magasins","/recherche?q=doudoune"]
      .map(u=>"<li>"+esc(u)+"</li>").join("")+"</ul>";
    notice.appendChild(cov);
    $("#cov-btn").onclick = e=>{
      const open = cov.dataset.open==="true";
      cov.dataset.open = String(!open);
      e.currentTarget.setAttribute("aria-expanded", String(!open));
    };
  }
}

function renderQueue(){
  const col = el("section","col queue");

  const head = el("div","queue__head");
  const todo = items.filter(f=>f.statut==="a_juger").length;
  const bTodo = el("button","hit filter","<span>À juger <b>"+todo+"</b></span>");
  bTodo.setAttribute("aria-pressed", String(onlyTodo));
  bTodo.onclick=()=>{onlyTodo=true;sel=0;render()};
  const bAll = el("button","hit filter","<span>Tous <b>"+items.length+"</b></span>");
  bAll.setAttribute("aria-pressed", String(!onlyTodo));
  bAll.onclick=()=>{onlyTodo=false;sel=0;render()};
  head.appendChild(bTodo); head.appendChild(bAll);
  const hint = el("span","hit",'<span><kbd>F</kbd></span>');
  hint.style.marginLeft="auto"; hint.style.pointerEvents="none";
  head.appendChild(hint);
  col.appendChild(head);

  const list = el("div","queue__list");
  list.setAttribute("role","listbox");
  list.setAttribute("aria-label","Constats du run");
  list.id="queue-list";

  const v = visible();
  const cur = current();
  v.forEach((f,i)=>{
    const row = el("button","row"+(f.fresh?" row--new":""));
    row.setAttribute("role","option");
    row.setAttribute("aria-selected", String(cur && f.id===cur.id));
    row.dataset.statut = f.statut;
    row.dataset.id = f.id;

    let flags="";
    if(f.runs.length>=3) flags+='<span class="flag">'+f.runs.length+'ᵉ run</span>';
    else if(f.runs.length===2) flags+='<span class="flag flag--quiet">2ᵉ run</span>';
    if(f.statut==="actionnable") flags+='<span class="flag flag--quiet">Actionnable</span>';
    if(f.statut==="bruit") flags+='<span class="flag flag--quiet">Bruit</span>';
    if(f.statut==="exporte") flags+='<span class="flag">'+esc(f.linear.id)+'</span>';

    row.innerHTML =
      '<span class="row__top"><span class="row__cat">'+esc(CAT_LABEL[f.cat])+'</span>'+
      '<span class="row__flags">'+flags+'</span></span>'+
      '<span class="row__zone">'+esc(f.zone)+'</span>'+
      '<span class="row__obs">'+esc(f.obs)+'</span>'+
      '<span class="row__url">'+esc(f.url)+'</span>';
    row.onclick=()=>{sel=i;render()};
    list.appendChild(row);
  });

  const r = runOf();
  if(r && r.live){
    const p = el("div","queue__pending");
    p.innerHTML='<span class="skel"></span><span class="skel"></span>';
    p.setAttribute("aria-hidden","true");
    list.appendChild(p);
  }else if(v.length===0){
    list.appendChild(el("div","queue__end","Tous les constats de ce run sont jugés. Bascule sur « Tous » pour les revoir."));
  }

  col.appendChild(list);
  return col;
}

  head.innerHTML = '<span class="evidence__url">'+esc(SHOP+f.url)+'</span>';
  const t = el("button","hit iconbtn", "<span>"+(dim?"Sans surlignage":"Avec surlignage")+' <kbd>S</kbd></span>');
  t.onclick=()=>{dim=!dim;render()};
  head.appendChild(t);
  col.appendChild(head);

  const stage = el("div","evidence__stage");
  const fig = el("div","shot", renderShot(f, dim));
  fig.dataset.dim = dim?"on":"off";
  fig.onclick=()=>{dim=!dim;render()};
  fig.title = dim ? "Cliquer pour voir la capture entière" : "Cliquer pour resurligner la zone";
  stage.appendChild(fig);
  col.appendChild(stage);
  return col;
}

function renderVerdict(f){
  const col = el("section","col verdict");
  const s = el("div","verdict__scroll");

  if(f.runs.length>=3){
    const p = el("div","persist");
    p.innerHTML =
      '<p class="persist__t">Vu aux '+f.runs.length+' derniers runs, jamais jugé</p>'+
      '<p class="persist__d">Relevé pour la première fois le '+esc(f.first||"21 juillet")+
      '. Il est resté à l\'identique depuis : la zone n\'a pas changé et le constat n\'a pas été traité.</p>'+
      '<div class="runs">'+f.runs.map(n=>"<span>run "+n+"</span>").join("")+'</div>';
    s.appendChild(p);
  }

  if(f.statut==="bruit"){
    const r = el("div","resolved");
    r.innerHTML =
      '<p class="resolved__t">Jugé bruit le '+esc(f.juge||"8 août")+'</p>'+
      '<p class="resolved__d">Sorti de la file. Ce constat ne sera plus remonté pour cette zone tant que la page ne change pas — '+
      'si la zone est modifiée, il reviendra à juger.</p>';
    s.appendChild(r);
  }
  if(f.statut==="exporte"){
    const r = el("div","resolved");
    r.innerHTML =
      '<p class="resolved__t">Exporté vers Linear</p>'+
      '<p class="resolved__d">La user story reprend l\'observation, l\'impact et la capture. '+
      'Tower ne suit pas l\'avancement du ticket au-delà de son état.</p>'+
      '<div class="linear"><span class="linear__id">'+esc(f.linear.id)+'</span>'+
      '<span class="linear__state">'+esc(f.linear.state)+'</span>'+
      '<a class="linear__link" href="#" onclick="return false">Ouvrir dans Linear ↗</a></div>';
    s.appendChild(r);
  }

  s.appendChild(el("p","eyebrow","Observation"));
  s.appendChild(el("p","obs",esc(f.obs)));
  s.appendChild(el("p","eyebrow","Impact estimé"));
  s.appendChild(el("p","impact",esc(f.imp)));

  const dl = el("dl","facts");
  const facts = [
    ["Catégorie", CAT_LABEL[f.cat]],
    ["Zone", f.zone],
    ["Page", SHOP+f.url],
    ["Constat", f.id]
  ];
  facts.forEach(([k,v])=>{
    const row = el("div","fact");
    row.innerHTML = "<dt>"+esc(k)+"</dt><dd>"+esc(v)+"</dd>";
    dl.appendChild(row);
  });
  s.appendChild(dl);
  col.appendChild(s);

  /* Barre de jugement */
  const j = el("div","judge");
  if(f.statut==="a_juger"){
    const a = el("button","btn btn--go","Actionnable<small>A</small>");
    a.onclick=()=>judge("actionnable");
    const b = el("button","btn","Bruit<small>B</small>");
    b.onclick=()=>judge("bruit");
    const e = el("button","btn","Exporter<small>E</small>");
    e.onclick=()=>judge("exporte");
    j.appendChild(a); j.appendChild(b); j.appendChild(e);
  }else if(f.statut==="actionnable"){
    const e = el("button","btn btn--go btn--wide","Exporter vers Linear<small>E</small>");
    e.onclick=()=>judge("exporte");
    const u = el("button","btn","Remettre en file<small>U</small>");
    u.onclick=()=>judge("a_juger");
    j.appendChild(e); j.appendChild(u);
  }else if(f.statut==="bruit"){
    const u = el("button","btn btn--wide","Remettre en file<small>U</small>");
    u.onclick=()=>judge("a_juger");
    j.appendChild(u);
    j.className="judge judge--single";
  }else{
    const u = el("button","btn btn--wide","Détacher du ticket et remettre en file<small>U</small>");
    u.onclick=()=>judge("a_juger");
    j.appendChild(u);
    j.className="judge judge--single";
  }
  col.appendChild(j);
  return col;
}

  const box = el("div","blank");
  box.innerHTML =
    '<div class="blank__box">'+
    '<h1 class="blank__t">Le premier audit tourne cette nuit</h1>'+
    '<p class="blank__d">L\'agent parcourt alpinia.ch entre 4 h et 6 h, quand la boutique est calme, '+
    'et se comporte comme le persona que vous avez décrit. Les constats seront ici demain matin. '+
    'Comptez entre cinq et trente constats pour un premier passage.</p>'+
    '<ol class="steps">'+
    '<li><span class="n done">✓</span><span><b>Boutique connectée</b><p>alpinia.ch — vérifiée le 7 août.</p></span></li>'+
    '<li><span class="n done">✓</span><span><b>Persona décrit</b><p>Léa — première visite, compare trois boutiques avant d\'acheter.</p></span></li>'+
    '<li><span class="n done">✓</span><span><b>Linear connecté</b><p>Espace Croissance — les exports arriveront dans le backlog.</p></span></li>'+
    '<li><span class="n">4</span><span><b>Premier run</b><p>Programmé cette nuit, 4 h 30. Agent UX. Rien à faire d\'ici là.</p></span></li>'+

function render(){
  renderStates();
  renderRunbar();
  const ws = $("#workspace");
  ws.innerHTML="";

  if(state==="vide"){ ws.appendChild(renderEmpty()); return; }

  const v = visible();
  if(sel >= v.length) sel = Math.max(0, v.length-1);
  const f = current();
  ws.appendChild(renderQueue());
  if(f){
    ws.appendChild(renderEvidence(f));
    ws.appendChild(renderVerdict(f));
  }
  const cur = ws.querySelector('.row[aria-selected="true"]');
  if(cur) cur.scrollIntoView({block:"nearest"});
}

/* ============================================================
   JUGEMENT — un geste, puis avance tout seul
   ============================================================ */
const VERB = {actionnable:"classé actionnable", bruit:"classé bruit", exporte:"exporté vers Linear", a_juger:"remis en file"};

function judge(next){
  const f = current(); if(!f) return;
  const idx = items.findIndex(x=>x.id===f.id);
  lastAction = {id:f.id, from:f.statut, linear:f.linear||null};
  items[idx].statut = next;
  if(next==="exporte" && !items[idx].linear){
    items[idx].linear = {id:"TOW-"+(220+Math.floor(idx)), state:"Backlog"};
  }
  if(next==="bruit") items[idx].juge = "aujourd'hui";
  if(next==="a_juger"){ items[idx].linear=null; items[idx].juge=null; }

  toast((next==="exporte" ? f.id+" exporté vers Linear · "+items[idx].linear.id : f.id+" "+VERB[next]));
  if(onlyTodo && next!=="a_juger"){ /* la file se referme, sel reste en place */ }
  else if(next!=="a_juger"){ sel = Math.min(sel+1, visible().length-1); }
  render();
}

function undo(){
  if(!lastAction) return;
  const i = items.findIndex(x=>x.id===lastAction.id);
  if(i<0) return;
  items[i].statut = lastAction.from;
  items[i].linear = lastAction.linear;
  const v = visible().findIndex(x=>x.id===lastAction.id);
  if(v>=0) sel = v;
  lastAction = null;
  hideToast();
  render();
}

let toastTimer=null;
function toast(text){
  $("#toast-text").textContent = text;
  $("#toast").dataset.open="true";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $("#toast").dataset.open="false"; }
$("#toast-undo").onclick = undo;

/* ============================================================
   CLAVIER
   ============================================================ */
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key.toLowerCase();
  if(k==="escape"){ $("#help").dataset.open="false"; hideToast(); return; }
  if(k==="?"||(e.shiftKey&&k==="/")){ e.preventDefault(); const h=$("#help"); h.dataset.open = h.dataset.open==="true"?"false":"true"; return; }
  if(state==="vide") return;
  const v = visible();
  if(k==="j"||e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(sel+1,v.length-1); render(); }
  else if(k==="k"||e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(sel-1,0); render(); }
  else if(k==="a"){ e.preventDefault(); if(current()&&current().statut==="a_juger") judge("actionnable"); }
  else if(k==="b"){ e.preventDefault(); if(current()&&current().statut==="a_juger") judge("bruit"); }
  else if(k==="e"){ e.preventDefault(); if(current()&&current().statut!=="exporte") judge("exporte"); }
  else if(k==="u"){ e.preventDefault(); if(lastAction) undo(); else if(current()&&current().statut!=="a_juger") judge("a_juger"); }
  else if(k==="f"){ e.preventDefault(); onlyTodo=!onlyTodo; sel=0; render(); }
  else if(k==="s"){ e.preventDefault(); dim=!dim; render(); }
});

/* ============================================================
   ÉTATS
   ============================================================ */
function setState(next){
  state = next;
  clearInterval(liveTimer); liveTimer=null; liveIdx=0;
  lastAction=null; hideToast(); onlyTodo=true; sel=0; dim=true;

  if(next==="vide"){ items=[]; render(); return; }

  if(next==="encours"){
    items = clone(LIVE).slice(0,4);
    liveTimer = setInterval(()=>{
      if(items.length >= LIVE.length){ clearInterval(liveTimer); liveTimer=null; return; }
      const nx = {...LIVE[items.length], fresh:true};
      items.forEach(f=>f.fresh=false);
      items.push(nx);
      liveIdx += 2;
      render();
    }, 3200);
    render(); return;
  }

  if(next==="interrompu"){ items = clone(PARTIAL); render(); return; }

  items = clone(F);
  if(next==="recurrent"){ onlyTodo=true; sel = visible().findIndex(f=>f.runs.length>=3); }
  if(next==="bruit"){ onlyTodo=false; sel = items.findIndex(f=>f.statut==="bruit"); }
  if(next==="exporte"){ onlyTodo=false; sel = items.findIndex(f=>f.statut==="exporte"); }
  if(sel<0) sel=0;
  render();
}

/* Thème */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $("#theme-lbl").textContent = t==="dark" ? "Clair" : "Sombre";
}
$("#theme-btn").onclick = ()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#help-btn").onclick = ()=>{const h=$("#help"); h.dataset.open = h.dataset.open==="true"?"false":"true"};
$("#help").onclick = e=>{ if(e.target===$("#help")) $("#help").dataset.open="false"; };

applyTheme(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
setState("recurrent");
</script>
