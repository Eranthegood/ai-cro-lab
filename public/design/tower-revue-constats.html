<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower — Revue des constats</title>
<style>
/* ============================================================
   TOKENS — thème clair et sombre définis explicitement.
   Contraste vérifié AA sur toutes les paires texte/fond.
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg-sunken:#fafafa;
  --surface:#ffffff;
  --surface-hover:#f4f5f8;
  --surface-sel:#eeeff0;
  --border:#e4e5e9;
  --border-strong:#c4c6cd;
  --text:#0d0e10;      /* 19.2:1 sur --bg */
  --text-2:#3d3f45;    /* 10.5:1 sur --bg */
  --text-3:#5f6168;    /* 5.7:1  sur --bg, 4.7:1 sur la ligne sélectionnée */
  --accent:#5e6ad2;    /* indigo Linear — blanc dessus : 5.8:1 */
  --accent-fg:#ffffff;
  /* La capture est une photo du site réel : elle garde ses couleurs
     dans les deux thèmes. Une preuve qui s’inverse n’est plus une preuve. */
  --shot-page:#ffffff;
  --shot-ink:#1b1c1f;
  --shot-mut:#5a5d64;   /* 6,6:1 nu, 5,4:1 sous le voile */
  --shot-line:#e3e4e8;
  --shot-fill:#eceef1;
  --shot-frame:#f1f2f4;
  --dim:rgba(12,13,16,.18);
  --shot-edge:#d0d2d8;
  --shadow:0 1px 2px rgba(13,14,16,.06),0 8px 24px rgba(13,14,16,.08);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--text);
}
:root[data-theme="dark"]{
  --bg:#08090a;
  --bg-sunken:#0b0c0d;
  --surface:#101112;
  --surface-hover:#17181a;
  --surface-sel:#1c1d1e;
  --border:#1e2023;
  --border-strong:#36383e;
  --text:#f7f8f8;      /* 18.4:1 sur --bg */
  --text-2:#a2a5ad;    /* 8.6:1  sur --bg */
  --text-3:#8a8f98;    /* 6.1:1  sur --bg */
  --accent:#5e6ad2;    /* le meme indigo : l’accent ne change pas de teinte */
  --accent-fg:#ffffff;
  --dim:rgba(6,7,8,.20);
  --shot-edge:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.45);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--text);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#08090a;
  --bg-sunken:#0b0c0d;
  --surface:#101112;
  --surface-hover:#17181a;
  --surface-sel:#1c1d1e;
  --border:#1e2023;
  --border-strong:#36383e;
  --text:#f7f8f8;      /* 18.4:1 sur --bg */
  --text-2:#a2a5ad;    /* 8.6:1  sur --bg */
  --text-3:#8a8f98;    /* 6.1:1  sur --bg */
  --accent:#5e6ad2;    /* le meme indigo : l’accent ne change pas de teinte */
  --accent-fg:#ffffff;
  --dim:rgba(6,7,8,.20);
  --shot-edge:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 28px rgba(0,0,0,.45);
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--text);
}
}
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05" 1,"ss01" 1;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px}
::selection{background:var(--surface-sel);color:var(--text)}
kbd{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:10px;line-height:15px;display:inline-block;min-width:16px;
  padding:0 4px;text-align:center;border:1px solid var(--border-strong);
  border-bottom-width:2px;border-radius:4px;color:var(--text-3);
  background:var(--surface);vertical-align:middle;
}

/* ============================================================
   COQUE
   ============================================================ */
.app{display:flex;flex-direction:column;height:100vh;min-height:0}

/* --- Sélecteur d’état (outil de maquette, pas de produit) --- */
/* Cibles : tous les contrôles secondaires ont une zone cliquable de 44 px
   de haut ; seul le fond visible reste compact, pour tenir la densité. */
.hit{
  height:44px;flex:none;display:inline-flex;align-items:center;
  padding:0 2px;border-radius:6px;
}
.hit>span{
  display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;
  border-radius:6px;font-size:12px;color:var(--text-3);white-space:nowrap;
}
.hit:hover>span{background:var(--surface-hover);color:var(--text)}
.hit[aria-pressed="true"]>span{background:var(--surface-sel);color:var(--text);font-weight:500}

.states{
  display:flex;align-items:center;gap:10px;flex:none;
  padding:6px 14px;min-height:52px;background:var(--bg-sunken);
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.states__label{
  font-size:11px;color:var(--text-3);letter-spacing:.02em;
  flex:none;padding-right:4px;border-right:1px solid var(--border);height:18px;line-height:18px;
}
.states__list{display:flex;gap:1px;flex-wrap:wrap;flex:1;min-width:0}
.states__list::-webkit-scrollbar{display:none}
.chip>span{color:var(--text-2)}
.states__right{display:flex;align-items:center;gap:1px;flex:none}

/* --- Barre de run --- */
.runbar{flex:none;border-bottom:1px solid var(--border);background:var(--bg)}
.runbar__main{display:flex;align-items:center;gap:0;height:48px;padding:0 16px}
.runbar__title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0 12px 0 0;white-space:nowrap}
.meta{display:flex;align-items:center;gap:0;min-width:0;overflow:hidden}
.meta span{font-size:12px;color:var(--text-2);white-space:nowrap}
.meta span+span::before{content:"·";margin:0 8px;color:var(--border-strong)}
.runbar__spacer{flex:1}
.counts{display:flex;align-items:center;gap:10px;flex:none}
.counts__text{font-size:12px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.counts__text b{color:var(--text);font-weight:600}

/* pastille "en cours" */
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.live i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}

/* bandeau d’avertissement — calme, pas alarmant */
.notice{
  display:flex;align-items:flex-start;gap:10px;padding:10px 16px;
  border-top:1px solid var(--border);background:var(--bg-sunken);
}
.notice__mark{
  flex:none;margin-top:1px;width:16px;height:16px;border-radius:4px;
  border:1px solid var(--border-strong);color:var(--text-2);
  font-size:11px;line-height:14px;text-align:center;font-weight:600;
}
.notice__body{font-size:12px;color:var(--text-2);max-width:88ch}
.notice__body b{color:var(--text);font-weight:600}
.notice__more{
  color:var(--text);text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--border-strong);
  padding:13px 0;margin:-13px 0; /* 44 px de zone cliquable, zéro décalage */
}
.notice__more:hover{text-decoration-color:var(--text-3)}
.coverage{display:none;padding:0 16px 12px 42px}
.coverage[data-open="true"]{display:block}
.coverage ul{margin:0;padding:0;list-style:none;columns:3;column-gap:24px}
.coverage li{font-size:12px;color:var(--text-3);padding:2px 0;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}

/* ============================================================
   ESPACE DE TRAVAIL — 3 colonnes : file / preuve / verdict
   ============================================================ */
.workspace{flex:1;display:grid;grid-template-columns:302px minmax(0,1fr) 352px;min-height:0}
.col{min-height:0;display:flex;flex-direction:column}
.queue{border-right:1px solid var(--border);background:var(--bg-sunken)}
.evidence{background:var(--bg)}
.verdict{border-left:1px solid var(--border);background:var(--bg)}

/* --- File --- */
.queue__head{
  flex:none;display:flex;align-items:center;gap:1px;height:44px;padding:0 8px 0 10px;
  border-bottom:1px solid var(--border);
}
.filter b{font-variant-numeric:tabular-nums;font-weight:inherit;color:var(--text-2)}
.filter[aria-pressed="true"] b{color:var(--text)}
.queue__list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 32px}
.queue__list:focus-visible{box-shadow:inset var(--ring)}

.row{
  display:block;width:100%;text-align:left;position:relative;
  padding:8px 12px 9px 14px;border-bottom:1px solid var(--border);
  min-height:44px;
}
.row{scroll-margin-block:8px 132px}
.row::before{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:2px;background:transparent}
.row:hover{background:var(--surface-hover)}
.row[aria-selected="true"]{background:var(--surface-sel)}
.row[aria-selected="true"]::before{background:var(--text)}
.row:focus-visible{box-shadow:inset var(--ring)}
.row__top{display:flex;align-items:baseline;gap:8px}
.row__sub{display:flex;align-items:baseline;gap:8px;margin-top:2px;min-width:0}
.row__cat{font-size:11px;color:var(--text-3);white-space:nowrap;flex:none}
.row__flags{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.flag{
  font-size:10px;line-height:15px;padding:0 5px;border-radius:4px;
  border:1px solid var(--border-strong);color:var(--text-2);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.flag--quiet{border-color:transparent;color:var(--text-3);padding:0}
.row__zone{
  font-size:13px;color:var(--text);font-weight:500;letter-spacing:-.005em;
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row[data-statut="bruit"] .row__zone,.row[data-statut="exporte"] .row__zone{color:var(--text-2);font-weight:400}
.row__url{
  font-size:11px;color:var(--text-3);flex:1;min-width:0;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row--new{animation:slideIn .32s cubic-bezier(.2,.8,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.row--new{animation:none}}

.queue__pending{display:flex;align-items:center;gap:10px;padding:14px 14px}
.skel{flex:1;height:8px;border-radius:4px;background:var(--border);animation:shim 1.6s ease-in-out infinite}
.skel:nth-child(2){max-width:38%}
@keyframes shim{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.queue__end{padding:14px 14px 0;font-size:11px;color:var(--text-3)}

/* --- Preuve : la capture est le contenu principal --- */
.evidence__head{
  flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 16px;
  border-bottom:1px solid var(--border);
}
.evidence__url{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;
}
.evidence__stage{
  flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;
  padding:16px;background:var(--bg-sunken);overflow:hidden;
}
.shot:focus-visible{outline:2px solid var(--text);outline-offset:-3px;box-shadow:none}
.story__btn:focus-visible{outline:2px solid var(--text);outline-offset:-2px;box-shadow:none}
.shot{
  height:100%;max-width:100%;border-radius:8px;overflow:hidden;
  border:1px solid var(--shot-edge);background:var(--shot-frame);
  display:block;cursor:pointer;padding:0;
}
.shot svg{display:block;height:100%;width:auto;max-width:100%}

.shot[data-dim="off"] .dimmer{opacity:0}
.dimmer{transition:opacity .18s ease}
@media (prefers-reduced-motion:reduce){.dimmer{transition:none}}

/* --- Verdict --- */
.verdict__scroll:focus-visible{box-shadow:inset var(--ring)}
.verdict__scroll{flex:1;overflow-y:auto;padding:16px 18px 10px;min-height:0;display:flex;flex-direction:column}
.eyebrow{font-size:11px;color:var(--text-3);margin:0 0 5px}
.obs{font-size:13px;line-height:1.62;color:var(--text);margin:0 0 16px}
.impact{font-size:13px;line-height:1.55;color:var(--text-2);margin:0 0 16px}
.facts{border-top:1px solid var(--border);padding-top:12px;margin-top:auto}
.fact{display:flex;gap:12px;padding:3px 0;font-size:12px}
.fact dt{flex:none;width:74px;color:var(--text-3)}
.fact dd{margin:0;color:var(--text-2);min-width:0;word-break:break-word}
.fact dd b{color:var(--text);font-weight:500}

.persist{
  border:1px solid var(--border-strong);border-radius:6px;padding:10px 12px;margin:0 0 16px;
  background:var(--bg-sunken);
}
.persist__t{font-size:12px;font-weight:600;color:var(--text);margin:0 0 4px}
.persist__d{font-size:12px;color:var(--text-2);margin:0}
.runs{display:flex;gap:6px;margin-top:8px}
.runs span{
  font-size:11px;font-variant-numeric:tabular-nums;color:var(--text-2);
  border:1px solid var(--border-strong);border-radius:4px;padding:1px 6px;
}
.runs span:first-child{color:var(--text);border-color:var(--text-3)}

.resolved{
  border:1px solid var(--border);border-radius:6px;padding:12px;margin:0 0 16px;background:var(--bg-sunken);
}
.resolved__t{font-size:12px;font-weight:600;margin:0 0 4px;color:var(--text)}
.resolved__d{font-size:12px;color:var(--text-2);margin:0}
.linear{
  display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;
  border-top:1px solid var(--border);
}
.linear__id{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--text);font-weight:500;
}
.linear__state{font-size:11px;color:var(--text-2);border:1px solid var(--border-strong);border-radius:4px;padding:1px 6px}
.linear__link{
  margin-left:auto;font-size:12px;color:var(--text);text-decoration:underline;
  text-underline-offset:2px;text-decoration-color:var(--border-strong);
  display:inline-flex;align-items:center;height:44px;margin-top:-13px;margin-bottom:-13px;
}
.linear__link:hover{text-decoration-color:var(--text-3)}
.resolved__note{font-size:11px;color:var(--text-3);margin:8px 0 0}
.story__btn{
  margin-top:8px;height:44px;display:flex;align-items:center;font-size:12px;color:var(--text-2);
  text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--border-strong);
}
.story__btn:hover{color:var(--text)}
.story{display:none;border-top:1px solid var(--border);padding-top:10px;margin-top:-6px}
.story[data-open="true"]{display:block}
.story__t{font-size:12px;font-weight:600;margin:0 0 6px;color:var(--text)}
.story__d{font-size:12px;line-height:1.5;color:var(--text-2);margin:0 0 6px}
.story__d b{color:var(--text);font-weight:600}
.story__m{
  font-size:11px;color:var(--text-3);margin:0;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;word-break:break-all;
}
.judge__note{
  flex:none;margin:0;padding:0 14px 2px;font-size:11px;color:var(--text-3);
}
.queue__rule{
  display:flex;align-items:center;gap:8px;padding:8px 14px 7px;
  font-size:11px;color:var(--text-3);border-bottom:1px solid var(--border);
  background:var(--bg);
}
.queue__rule::after{content:"";flex:1;height:1px;background:var(--border)}
.queue__note{
  padding:9px 14px;font-size:11px;color:var(--text-3);border-bottom:1px solid var(--border);
}
.queue__note button{
  color:var(--text-2);text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--border-strong);
  display:inline-flex;align-items:center;height:44px;margin:-14px 0;vertical-align:middle;
}
.queue__note button:hover{color:var(--text)}

/* --- Barre de jugement : un geste = une touche --- */
.judge{
  flex:none;border-top:1px solid var(--border);padding:10px 14px;
  display:flex;gap:8px;background:var(--bg);
}
.btn{
  height:44px;flex:1;border-radius:6px;border:1px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:500;color:var(--text-2);background:none;min-width:0;
}
.btn:hover{background:var(--surface-hover);color:var(--text)}
.btn:active{transform:translateY(.5px)}
.btn small{
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10px;
  color:var(--text-3);font-weight:400;border:1px solid var(--border-strong);
  border-radius:4px;padding:0 4px;line-height:15px;
}
.btn--go{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);flex:1.2}
.btn--go small{color:var(--accent-fg);border-color:rgba(255,255,255,.42)}
.btn--go:hover{background:var(--accent);color:var(--accent-fg);filter:brightness(1.07)}
.btn--wide{flex:1}
.btn[disabled]{opacity:.45;cursor:default}
.judge--single{padding:10px 14px}

/* --- Toast d’annulation --- */
.toast{
  position:fixed;left:16px;bottom:16px;z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:9px 10px 9px 14px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow);
  font-size:12px;color:var(--text);
  opacity:0;visibility:hidden;transform:translateY(8px);pointer-events:none;
  transition:opacity .16s ease,transform .16s ease,visibility .16s;
}
.toast[data-open="true"]{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.toast button{height:44px;display:inline-flex;align-items:center;padding:0}
.toast button>span{
  height:28px;padding:0 9px;border-radius:6px;border:1px solid var(--border-strong);
  font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--text);
}
.toast button:hover>span{background:var(--surface-hover)}

/* --- États vides --- */
.done{
  grid-column:2/-1;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0;
}
.done__box{max-width:420px}
.done__t{font-size:15px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.done__d{font-size:13px;line-height:1.6;color:var(--text-2);margin:0 0 14px}
.done__k{font-size:12px;color:var(--text-3);margin:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.blank{
  grid-column:1/-1;display:flex;align-items:flex-start;justify-content:center;
  padding:64px 24px 24px;min-height:0;overflow-y:auto;
}
.blank__box{max-width:560px;width:100%}
.blank__t{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px}
.blank__d{font-size:13px;line-height:1.6;color:var(--text-2);margin:0 0 20px;max-width:56ch}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.steps li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.steps .n{
  flex:none;width:18px;height:18px;border-radius:6px;border:1px solid var(--border-strong);
  font-size:11px;line-height:16px;text-align:center;color:var(--text-3);margin-top:1px;
}
.steps .n--ok{border-color:transparent;background:var(--surface-sel);color:var(--text)}
.steps b{font-weight:500;display:block;color:var(--text)}
.steps p{margin:2px 0 0;color:var(--text-2);font-size:12px;line-height:1.5}
.blank__foot{margin-top:18px;font-size:12px;color:var(--text-3)}
.blank__more{
  color:var(--text-2);text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--border-strong);font-size:12px;
  display:inline-flex;align-items:center;height:44px;margin:-14px 0;vertical-align:middle;
}
.blank__more:hover{color:var(--text)}
.blank__lead{margin:22px 0 8px;font-size:11px;color:var(--text-3)}
.sample{display:flex;gap:14px;border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--bg-sunken)}
.sample__shot{
  flex:none;width:196px;height:150px;overflow:hidden;border-radius:6px;
  border:1px solid var(--shot-edge);background:var(--shot-page);
}
.sample__shot svg{width:100%;height:100%;display:block}
.sample__txt{min-width:0;display:flex;flex-direction:column;justify-content:center}
.sample__z{margin:0 0 5px;font-size:13px;font-weight:500;color:var(--text)}
.sample__o{
  margin:0 0 10px;font-size:12px;line-height:1.5;color:var(--text-2);
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.sample__k{margin:0;font-size:11px;color:var(--text-3);display:flex;gap:5px;align-items:center;flex-wrap:wrap}

const W = 900, H = 980, TOP = 52, FOOT = 908, BODY = H - TOP;

function px(v,total){return v*total/100}

function chrome(url){
  return `
  <rect x="0" y="0" width="${W}" height="${TOP}" fill="var(--shot-frame)"/>
  <circle cx="24" cy="26" r="5" fill="var(--shot-line)"/>
  <circle cx="42" cy="26" r="5" fill="var(--shot-line)"/>
  <circle cx="60" cy="26" r="5" fill="var(--shot-line)"/>
  <rect x="84" y="13" width="${W-108}" height="26" rx="6" fill="var(--shot-page)" stroke="var(--shot-line)"/>
  <text x="98" y="30" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="var(--shot-mut)">${esc(url)}</text>
  <line x1="0" y1="${TOP}" x2="${W}" y2="${TOP}" stroke="var(--shot-line)"/>`;
}

function siteHeader(){
  return `
  <text x="36" y="88" font-family="Inter,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="var(--shot-ink)">ALPINIA</text>
  ${["Vestes","Chaussures","Sacs","Accessoires","Nouveautés"].map((t,i)=>
    `<text x="${300+i*108}" y="88" font-family="Inter,sans-serif" font-size="13" fill="var(--shot-mut)">${t}</text>`).join("")}
  <circle cx="${W-52}" cy="82" r="9" fill="none" stroke="var(--shot-mut)" stroke-width="1.5"/>
  <line x1="0" y1="112" x2="${W}" y2="112" stroke="var(--shot-line)"/>`;
}

function footer(){
  return `<rect x="0" y="${FOOT}" width="${W}" height="${H-FOOT}" fill="var(--shot-frame)"/>
  ${["Mentions légales","CGV","Contact","Livraison et retours"].map((t,i)=>
    `<text x="${36+i*190}" y="${FOOT+42}" font-family="Inter,sans-serif" font-size="12" fill="var(--shot-mut)">${t}</text>`).join("")}`;
}

function lines(x,y,w,n,gap,c){
  let s="";
  for(let i=0;i<n;i++){
    const ww = i===n-1 ? w*0.62 : w*(0.86+((i*37)%14)/100);
    s+=`<rect x="${x}" y="${y+i*gap}" width="${ww}" height="7" rx="3.5" fill="${c||"var(--shot-line)"}"/>`;
  }
  return s;
}

function ctxOf(url){
  const prod = (url.match(/\/produits\/([^?#]+)/) || [])[1];
  const coll = (url.match(/\/collections\/([^?#]+)/) || [])[1];
  const q    = (url.match(/[?&]q=([^&]+)/) || [])[1];
  return {
    p: CATALOGUE[prod] || CATALOGUE["veste-alpine-3l"],
    c: COLLECTIONS[coll] || COLLECTIONS["vestes-techniques"],
    q: q ? decodeURIComponent(q.replace(/\+/g," ")) : "veste imperméable",
    etape: /adresse/.test(url) ? 1 : /livraison/.test(url) ? 2 : /paiement/.test(url) ? 3 : 0,
    vide: false,
    erreurZip: false, modale: false, erreurPanier: false
  };
}

/* `cadre` recadre la capture sur la zone observée : utile en vignette,
   où la page entière ne serait qu'une tache grise. */
function renderShot(finding, dim, cadre){
  const d = SHOTS[finding.shot] || SHOTS.pdp_cart;
  const ctx = ctxOf(finding.url);
  if(d.vide) ctx.vide = true;
  if(d.erreurZip) ctx.erreurZip = true;
  if(d.modale) ctx.modale = true;
  if(d.erreurPanier) ctx.erreurPanier = true;
  const body = (PAGES[d.page] || PAGES.pdp)(ctx);
  const bx = px(d.box[0],W), by = px(d.box[1],BODY)+TOP, bw = px(d.box[2],W), bh = px(d.box[3],BODY);

  /* L'étiquette de zone ne doit rien recouvrir de la page : on relève les
     textes réellement rendus et on choisit le premier ancrage libre. */
  const textes = [];
  const re = /<text\b([^>]*)>([^<]*)<\/text>/g;
  const attr = (t, n) => { const m = t.match(new RegExp(n+'="([^"]*)"')); return m ? m[1] : null; };
  let m;
  while((m = re.exec(body)) !== null){
    const at = m[1], txt = m[2] || "";
    const fs = parseFloat(attr(at,"font-size") || 13);
    const tx = parseFloat(attr(at,"x") || 0), ty = parseFloat(attr(at,"y") || 0);
    const w = txt.length * fs * 0.58;
    const anc = attr(at,"text-anchor");
    const x0 = anc === "end" ? tx - w : anc === "middle" ? tx - w/2 : tx;
    textes.push({x:x0, y:ty - fs, w, h:fs * 1.3});
  }
  /* Un cadre qui coupe un mot en deux n'est pas une preuve : on l'étend
     à toute ligne de texte qu'il ne recouvre que partiellement. */
  let x1 = bx, y1 = by, x2 = bx + bw, y2 = by + bh;
  textes.forEach(t => {
    const ox = Math.min(x2, t.x + t.w) - Math.max(x1, t.x);
    const oy = Math.min(y2, t.y + t.h) - Math.max(y1, t.y);
    if(ox > 1 && oy > 1 && (ox < t.w - 1 || oy < t.h - 1)){
      x1 = Math.min(x1, t.x - 4); x2 = Math.max(x2, t.x + t.w + 4);
      y1 = Math.min(y1, t.y - 3); y2 = Math.max(y2, t.y + t.h + 3);
    }
  });
  x1 = Math.max(2, x1); x2 = Math.min(W - 2, x2);
  y1 = Math.max(TOP + 2, y1); y2 = Math.min(H - 2, y2);
  const rx = x1, ry = y1, rw = x2 - x1, rh = y2 - y1;

  const lw = 10 + finding.zone.length * 6.5, lh = 21;
  const croise = (a) => a.y < TOP + 2 || a.x < 2 || a.x + a.w > W - 2 ||
    textes.some(t => a.x < t.x + t.w && a.x + a.w > t.x && a.y < t.y + t.h && a.y + a.h > t.y);
  const ancrages = [
    {x:rx,               y:ry - lh - 5},              // au-dessus, à gauche
    {x:rx + rw - lw,     y:ry - lh - 5},              // au-dessus, à droite
    {x:rx + 6,           y:ry + 6},                   // dedans, en haut à gauche
    {x:rx + rw - lw - 6, y:ry + 6},                   // dedans, en haut à droite
    {x:rx + 6,           y:ry + rh - lh - 6},         // dedans, en bas à gauche
    {x:rx,               y:ry + rh + 5},              // en dessous
    {x:rx - lw - 6,      y:ry + (rh - lh)/2},          // à gauche du cadre
    {x:rx + rw + 6,      y:ry + (rh - lh)/2}           // à droite du cadre
  ].map(a => ({...a, w:lw, h:lh}));
  const pose = ancrages.find(a => !croise(a)) || ancrages[2];

  let vb = `0 0 ${W} ${H}`;
  if(cadre){
    const mg = 46;
    const vx = Math.max(0, rx - mg), vy = Math.max(TOP, ry - mg - 22);
    const vw = Math.min(W - vx, rw + mg*2), vh = Math.min(H - vy, rh + mg*2 + 22);
    vb = `${vx} ${vy} ${vw} ${vh}`;
  }
  return `<svg viewBox="${vb}" role="img" preserveAspectRatio="xMidYMid meet"
      aria-label="Capture de ${esc(SHOP+finding.url)}, zone observée : ${esc(finding.zone)}">
    <rect width="${W}" height="${H}" fill="var(--shot-page)"/>
    ${chrome(SHOP + finding.url)}
    ${body}
    <g class="dimmer">
      <path fill="var(--dim)" fill-rule="evenodd"
        d="M0 ${TOP} H${W} V${H} H0 Z M${rx} ${ry} H${rx+rw} V${ry+rh} H${rx} Z"/>
      <rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" fill="none"
        stroke="#ffffff" stroke-width="2" rx="3"/>
      <rect x="${pose.x}" y="${pose.y}" width="${lw}" height="${lh}" rx="4" fill="#ffffff"/>
      <text x="${pose.x+6}" y="${pose.y+15}" font-family="Inter,sans-serif" font-size="11.5"
        font-weight="600" fill="#0d0e10">${esc(finding.zone)}</text>
    </g>
  </svg>`;
}

   ============================================================ */
let state = "recurrent";
let items = [];
let selId = null;
let onlyTodo = true;
let dim = true;
let undoStack = [];
let liveTimer = null;
let covOpen = false;
let queueScroll = 0;
let arrived = 0;
let liveIdx = 0;

const $ = s => document.querySelector(s);
const el = (t,c,h) => {const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};

function clone(a){return a.map(o=>({...o}))}

/* La position dans la file EST l’information de sévérité : un constat vu à
   plusieurs runs passe devant, à ancienneté de détection égale. */
function ordered(list){
  return list.map((f,i)=>({f,i}))
    .sort((a,b)=> (b.f.runs.length - a.f.runs.length) || (a.i - b.i))
    .map(o=>o.f);
}
function visible(){ return ordered(onlyTodo ? items.filter(f=>f.statut==="a_juger") : items); }
function current(){
  const v = visible();
  if(!v.length) return null;
  return v.find(f=>f.id===selId) || null;
}
/* Recale la sélection sur le constat le plus proche encore visible. */
function recaler(prefere){
  const v = visible();
  if(!v.length){ selId = null; return; }
  if(prefere && v.some(f=>f.id===prefere)){ selId = prefere; return; }
  if(!v.some(f=>f.id===selId)) selId = v[0].id;
}
function voisin(id, pas){
  const v = visible(), i = v.findIndex(f=>f.id===id);
  if(i<0) return v.length ? v[0].id : null;
  return v[Math.min(Math.max(i+pas,0), v.length-1)].id;
}

  const box = $("#states"); box.innerHTML="";
  STATES.forEach(s=>{
    const b = el("button","hit chip","<span>"+s.label+"</span>");
    b.id = "chip-"+s.key;
    b.setAttribute("role","radio");
    b.setAttribute("tabindex", state===s.key ? "0" : "-1");
    b.setAttribute("aria-checked", String(state===s.key));
    b.setAttribute("aria-pressed", String(state===s.key));
    b.onclick = ()=>setState(s.key);
    box.appendChild(b);
  });
}

function runOf(){
  if(state==="vide") return null;
  if(state==="encours") return RUNS.encours;
  if(state==="interrompu") return RUNS.interrompu;
  return RUNS.revue;
}

      "/produits/bonnet-laine","/produits/lampe-frontale","/produits/gourde-1l","/produits/batons-carbone",

      "/collections/chaussures","/collections/accessoires","/guide-des-tailles","/contact",
      "/marques/alpinia","/blog/entretien-membrane","/blog/choisir-sa-doudoune","/cartes-cadeaux",
      "/magasins","/recherche?q=doudoune"]

function renderQueue(){
  const col = el("section","col queue");
  col.setAttribute("aria-label","File des constats");

  const head = el("div","queue__head");
  const todo = items.filter(f=>f.statut==="a_juger").length;
  const bTodo = el("button","hit filter","<span>À juger <b>"+todo+"</b></span>");
  bTodo.id="f-todo";
  bTodo.setAttribute("aria-pressed", String(onlyTodo));
  bTodo.onclick=()=>{onlyTodo=true;recaler(selId);render()};
  const bAll = el("button","hit filter","<span>Tous <b>"+items.length+"</b></span>");
  bAll.id="f-all";
  bAll.setAttribute("aria-pressed", String(!onlyTodo));
  bAll.onclick=()=>{onlyTodo=false;recaler(selId);render()};
  head.appendChild(bTodo); head.appendChild(bAll);
  const hint = el("span","hit",'<span><kbd>F</kbd></span>');
  hint.style.marginLeft="auto"; hint.style.pointerEvents="none";
  head.appendChild(hint);
  col.appendChild(head);

  const list = el("div","queue__list");
  list.addEventListener("scroll", ()=>{ queueScroll = list.scrollTop; }, {passive:true});
  list.setAttribute("role","listbox");
  list.setAttribute("aria-label","Constats du run");
  list.setAttribute("tabindex","0");
  list.id="queue-list";

  const v = visible();
  const cur = current();
  const nNouveaux = items.filter(f=>f.nouveau).length;
  let reglePosee = false;
  v.forEach((f,i)=>{
    if(f.nouveau && !reglePosee){
      reglePosee = true;
      const r = el("div","queue__rule",
        nNouveaux+(nNouveaux>1?" constats arrivés":" constat arrivé")+" depuis votre arrivée");
      r.setAttribute("role","presentation");
      list.appendChild(r);
    }
    const row = el("button","row"+(f.nouveau?" row--new":""));
    row.setAttribute("role","option");
    row.setAttribute("tabindex","-1");
    row.id = "row-"+f.id;
    row.setAttribute("aria-selected", String(cur && f.id===cur.id));
    if(cur && f.id===cur.id) list.setAttribute("aria-activedescendant","row-"+f.id);
    row.dataset.statut = f.statut;
    row.dataset.id = f.id;

    let flags="";
    if(f.runs.length>=3) flags+='<span class="flag">'+f.runs.length+'ᵉ run</span>';
    else if(f.runs.length===2) flags+='<span class="flag flag--quiet">2ᵉ run</span>';
    if(f.statut==="actionnable") flags+='<span class="flag flag--quiet">Actionnable</span>';
    if(f.statut==="bruit") flags+='<span class="flag flag--quiet">Bruit</span>';
    if(f.statut==="exporte") flags+='<span class="flag">'+esc(f.linear.id)+'</span>';

    row.innerHTML =
      '<span class="row__top"><span class="row__zone">'+esc(f.zone)+'</span>'+
      '<span class="row__flags">'+flags+'</span></span>'+
      '<span class="row__sub"><span class="row__cat">'+esc(CAT_LABEL[f.cat])+'</span>'+
      '<span class="row__url">'+esc(f.url)+'</span></span>';
    row.onclick=()=>{selId=f.id;render()};
    list.appendChild(row);
  });

  const r = runOf();
  if(r && r.live){
    const p = el("div","queue__pending");
    p.innerHTML='<span class="skel"></span><span class="skel"></span>';
    p.setAttribute("aria-hidden","true");
    list.appendChild(p);
  }else if(r && r.fini){
    list.appendChild(el("div","queue__end","Run "+r.n+" terminé à "+r.fini.heure+
      " — "+r.fini.pages+" pages parcourues, "+r.fini.n+" constats."));
  }else if(v.length===0){
    list.appendChild(el("div","queue__end","Tous les constats de ce run sont jugés. Basculez sur « Tous » pour les revoir."));
  }

  const nBruit = items.filter(f=>f.statut==="bruit").length;
  if(nBruit && onlyTodo){
    const n = el("div","queue__note");
    n.innerHTML = nBruit+' constat'+(nBruit>1?'s':'')+' non remonté'+(nBruit>1?'s':'')+
      ' par vos règles de bruit. <button>Voir</button>';
    n.querySelector("button").onclick = ()=>{ onlyTodo=false; const b=visible().find(f=>f.statut==="bruit"); if(b) selId=b.id; render(); };
    col.appendChild(n);
  }
  col.appendChild(list);
  return col;
}

  t.id="dim-btn";

  head.appendChild(t);
  col.appendChild(head);

  const stage = el("div","evidence__stage");
  const fig = el("button","shot", renderShot(f, dim));
  fig.id="shot-btn";
  fig.dataset.dim = dim?"on":"off";
  fig.setAttribute("aria-pressed", String(dim));
  fig.setAttribute("aria-label", dim
    ? "Surlignage de la zone activé. Activer pour voir la capture entière."
    : "Surlignage désactivé. Activer pour resurligner la zone « "+f.zone+" ».");
  fig.onclick=()=>{dim=!dim;render()};
  stage.appendChild(fig);
  /* En largeur tablette la capture déborde : on l’amène sur la zone. */
  const d = SHOTS[f.shot] || SHOTS.pdp_cart;
  requestAnimationFrame(()=>{
    if(stage.scrollHeight > stage.clientHeight + 4){
      const y = (px(d.box[1],BODY)+TOP) / H * fig.offsetHeight;
      stage.scrollTop = Math.max(0, y - stage.clientHeight * 0.32);
    }
  });
  col.appendChild(stage);
  return col;
}

      corps = "Relevé pour la première fois le "+esc(f.first)+
        ". Il est resté à l’identique depuis : la zone n’a pas changé et le constat n’a pas été traité. "+
        f.runs.length+" détections consécutives, la dernière au run "+f.runs[0]+".";
    }
    p.innerHTML =
      '<p class="persist__t">'+titre+'</p>'+
      '<p class="persist__d">'+corps+'</p>'+
      '<div class="runs">'+f.runs.map(n=>"<span>run "+n+"</span>").join("")+'</div>';
    s.appendChild(p);
  }

  if(f.statut==="bruit"){
    const r = el("div","resolved");
    r.innerHTML =
      '<p class="resolved__t">Jugé bruit '+(f.juge ? "le "+esc(f.juge) : "à l’instant")+'</p>'+
      '<p class="resolved__d">Sorti de la file. Ce constat ne sera plus remonté pour cette zone tant que la page ne change pas — '+
      'si la zone est modifiée, il reviendra à juger.</p>';
    s.appendChild(r);
  }
  if(f.statut==="exporte"){
    const r = el("div","resolved");
    const quand = f.linear.exporte, lu = f.linear.lu;
    r.innerHTML =
      '<p class="resolved__t">Exporté vers Linear'+(quand?" le "+esc(quand):"")+'</p>'+
      '<p class="resolved__d">Tower ne suit pas l’avancement du ticket au-delà de son état, '+
      'relu à chaque run.</p>'+
      '<div class="linear"><span class="linear__id">'+esc(f.linear.id)+'</span>'+
      '<span class="linear__state">'+esc(f.linear.state)+'</span>'+
      '<a class="linear__link" href="#" onclick="return false">Ouvrir dans Linear ↗</a></div>'+
      (lu?'<p class="resolved__note">État lu au dernier run, le '+esc(lu)+'.</p>':'')+
      '<button class="story__btn" aria-expanded="false">Voir la user story envoyée</button>'+
      '<div class="story">'+
        '<p class="story__t">'+esc(f.zone)+' — '+esc(CAT_LABEL[f.cat])+'</p>'+
        '<p class="story__d">'+esc(f.obs)+'</p>'+
        '<p class="story__d"><b>Pourquoi ça compte.</b> '+esc(f.imp)+'</p>'+
        '<p class="story__m">'+esc(SHOP+f.url)+' · capture jointe · étiquettes : cro, '+esc(f.cat)+'</p>'+
      '</div>';
    const sb = r.querySelector(".story__btn"), sd = r.querySelector(".story");
    sb.onclick = ()=>{
      const open = sd.dataset.open === "true";
      sd.dataset.open = String(!open);
      sb.setAttribute("aria-expanded", String(!open));
      sb.textContent = open ? "Voir la user story envoyée" : "Masquer la user story";
      if(!open) sd.scrollIntoView({block:"nearest"});
    };
    s.appendChild(r);
  }

  s.appendChild(el("p","eyebrow","Observation"));
  s.appendChild(el("p","obs",esc(f.obs)));
  s.appendChild(el("p","eyebrow","Impact estimé"));
  s.appendChild(el("p","impact",esc(f.imp)));

  const dl = el("dl","facts");
  const facts = [
    ["Catégorie", CAT_LABEL[f.cat]],
    ["Zone", f.zone],
    ["Page", SHOP+f.url],
    ["Constat", f.id]
  ];
  facts.forEach(([k,v])=>{
    const row = el("div","fact");
    row.innerHTML = "<dt>"+esc(k)+"</dt><dd>"+esc(v)+"</dd>";
    dl.appendChild(row);
  });
  s.appendChild(dl);
  col.appendChild(s);

  /* Barre de jugement */
  const j = el("div","judge");
  if(f.statut==="a_juger"){
    const a = el("button","btn btn--go","Actionnable<small aria-hidden='true'>A</small>");
    a.onclick=()=>judge("actionnable");
    const b = el("button","btn","Bruit<small aria-hidden='true'>B</small>");
    b.onclick=()=>judge("bruit");
    const e = el("button","btn","Exporter<small aria-hidden='true'>E</small>");
    e.onclick=()=>judge("exporte");
    j.appendChild(a); j.appendChild(b); j.appendChild(e);
  }else if(f.statut==="actionnable"){
    const e = el("button","btn btn--go btn--wide","Exporter vers Linear<small aria-hidden='true'>E</small>");
    e.onclick=()=>judge("exporte");
    const u = el("button","btn","Remettre en file");
    u.onclick=()=>judge("a_juger");
    j.appendChild(e); j.appendChild(u);
  }else if(f.statut==="bruit"){
    const u = el("button","btn btn--wide","Remettre en file");
    u.onclick=()=>judge("a_juger");
    j.appendChild(u);
    j.className="judge judge--single";
  }else{
    const u = el("button","btn btn--wide","Détacher du ticket et remettre en file");
    u.onclick=()=>judge("a_juger");
    u.title = "Le ticket "+f.linear.id+" restera dans Linear ; seul le lien est retiré.";
    j.appendChild(u);
    j.className="judge judge--single";
    const n = el("p","judge__note","Le ticket "+esc(f.linear.id)+" restera dans Linear ; seul le lien est retiré.");
    col.appendChild(n);
  }
  col.appendChild(j);
  return col;
}

function render(opts){
  const act = document.activeElement;
  const focusKey = act && act !== document.body
    ? (act.id || act.className || null) : null;
  renderStates();
  renderRunbar();
  const ws = $("#workspace");

  /* Un constat qui arrive en cours de run ne doit pas faire sauter la
     lecture en cours : on ne reconstruit que la file. */
  if(opts && opts.queueOnly && ws.firstChild){
    const old = ws.querySelector(".queue");
    if(old){ ws.replaceChild(renderQueue(), old); return; }
  }
  ws.innerHTML="";

  if(state==="vide"){ ws.appendChild(renderEmpty()); return; }

  const v = visible();
  recaler(selId);
  const f = current();
  ws.appendChild(renderQueue());
  if(f){
    ws.appendChild(renderEvidence(f));
    ws.appendChild(renderVerdict(f));
  }else{
    ws.appendChild(renderDone());
  }
  const list = ws.querySelector("#queue-list");
  if(list && queueScroll) list.scrollTop = queueScroll;
  if(focusKey){
    const back = document.getElementById(focusKey) ||
      document.querySelector('.'+String(focusKey).trim().split(/\s+/).join('.'));
    if(back && typeof back.focus === "function") back.focus({preventScroll:true});
  }
  const anc = $("#announce");
  if(anc) anc.textContent = f
    ? "Constat affiché : "+f.zone+", "+CAT_LABEL[f.cat]+", "+f.url
    : "Aucun constat sélectionné.";
  const cur = ws.querySelector('.row[aria-selected="true"]');
  if(cur){
    cur.scrollIntoView({block:"nearest"});
    if(list) queueScroll = list.scrollTop;
  }
}

/* ============================================================
   JUGEMENT — un geste, puis avance tout seul
   ============================================================ */
const VERB = {actionnable:"classé actionnable", bruit:"classé bruit", exporte:"exporté vers Linear", a_juger:"remis en file"};
const ETAT = {actionnable:"déjà classé actionnable", bruit:"déjà classé bruit", exporte:"déjà exporté vers Linear", a_juger:"à juger"};

function judge(next){
  const f = current(); if(!f) return;
  const idx = items.findIndex(x=>x.id===f.id);
  const suivant = voisin(f.id, 1) === f.id ? voisin(f.id, -1) : voisin(f.id, 1);
  undoStack.push({id:f.id, from:f.statut, linear:f.linear||null, juge:f.juge||null});
  if(undoStack.length>20) undoStack.shift();
  items[idx].statut = next;
  if(next==="exporte" && !items[idx].linear){
    items[idx].linear = items[idx].linearPasse ||
      {id:"GRO-"+items[idx].id.replace(/\D/g,"").slice(-3), state:"Backlog", exporte:null, lu:null};
  }
  if(next==="bruit") items[idx].juge = null;   /* jugé à l’instant */
  if(next==="a_juger"){
    if(items[idx].linear) items[idx].linearPasse = items[idx].linear;  /* le ticket existe toujours dans Linear */
    items[idx].linear=null; items[idx].juge=null;
  }

  toast((next==="exporte" ? f.id+" exporté vers Linear · "+items[idx].linear.id : f.id+" "+VERB[next]));
  if(next!=="a_juger") recaler(suivant);   /* on avance sur l'identité, pas sur un rang */
  render();
}
/* U annule le dernier jugement posé pendant cette session, toujours, et
   annonce exactement ce qu’il défait. Il ne touche jamais un verdict
   hérité d’un run précédent : celui-là se reprend par son bouton. */
function undo(){
  const act = undoStack.pop();
  if(!act){ toast("Rien à annuler dans cette session."); return; }
  const i = items.findIndex(x=>x.id===act.id);
  if(i<0) return;
  if(items[i].linear) items[i].linearPasse = items[i].linear;
  items[i].statut = act.from;
  items[i].linear = act.linear;
  items[i].juge   = act.juge;
  const v = visible().findIndex(x=>x.id===act.id);
  selId = act.id;
  toast("Annulé : "+act.id+" "+(act.from==="a_juger" ? "de nouveau à juger" : VERB[act.from])+".");
  render();
}

let toastTimer=null;
function toast(text){
  $("#toast-text").textContent = text;
  $("#toast").dataset.open="true";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $("#toast").dataset.open="false"; }
/* le bandeau disparaît, mais U reste disponible tant qu’il y a une pile */
$("#toast-undo").onclick = undo;

/* ============================================================
   CLAVIER
   ============================================================ */
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key.toLowerCase();
  const helpOpen = $("#help").dataset.open==="true";
  if(k==="escape"){ $("#help").dataset.open="false"; hideToast(); return; }
  if(k==="?"||(e.shiftKey&&k==="/")){ e.preventDefault(); const h=$("#help"); h.dataset.open = helpOpen?"false":"true"; if(!helpOpen) $("#help-close").focus(); return; }
  if(helpOpen){ if(e.key==="Tab") trapHelp(e); else e.preventDefault(); return; }
  if(state==="vide") return;
  /* défilement du verdict au clavier quand il déborde (largeur tablette) */
  if(e.key==="PageDown"||e.key==="PageUp"||(k===" "&&!e.shiftKey)){
    const sc = document.querySelector(".verdict__scroll");
    if(sc && sc.scrollHeight > sc.clientHeight){
      e.preventDefault();
      sc.scrollBy({top:(e.key==="PageUp"?-1:1)*(sc.clientHeight-40)});
      return;
    }
  }
  const v = visible();
  if(k==="j"||e.key==="ArrowDown"){ e.preventDefault(); selId=voisin(selId,1); render(); }
  else if(k==="k"||e.key==="ArrowUp"){ e.preventDefault(); selId=voisin(selId,-1); render(); }
  else if(k==="a"||k==="b"){
    e.preventDefault();
    const c = current();
    if(c && c.statut==="a_juger") judge(k==="a" ? "actionnable" : "bruit");
    else if(c) toast(c.id+" est "+ETAT[c.statut]+(undoStack.length ? " — U pour annuler le dernier jugement." : "."));
  }
  else if(k==="e"){
    e.preventDefault();
    const c = current();
    if(c && (c.statut==="a_juger" || c.statut==="actionnable")) judge("exporte");
    else if(c) toast(c.id+" est "+ETAT[c.statut]+(undoStack.length ? " — U pour annuler le dernier jugement." : "."));
  }
  else if(k==="u"){ e.preventDefault(); undo(); }
  else if(k==="f"){ e.preventDefault(); onlyTodo=!onlyTodo; recaler(selId); render(); }
  else if(k==="s"){ e.preventDefault(); dim=!dim; render(); }
});

/* ============================================================
   ÉTATS
   ============================================================ */
function setState(next){
  state = next;
  clearInterval(liveTimer); liveTimer=null; liveIdx=0;
  undoStack=[]; covOpen=false; queueScroll=0; hideToast(); onlyTodo=true; selId=null; dim=true;

  if(next==="vide"){ items=[]; render(); return; }

  if(next==="encours"){
    RUNS.encours.live = true;
    RUNS.encours.fini = null;
    arrived = 0;
    items = clone(LIVE).slice(0,4);
    recaler(null);
    liveTimer = setInterval(()=>{
      if(items.length >= LIVE.length){
        clearInterval(liveTimer); liveTimer=null;
        RUNS.encours.live = false;
        RUNS.encours.fini = {heure:"6 h 41", pages:RUNS.encours.pages[1], n:items.length};
        render();
        return;
      }
      const nx = LIVE[items.length];
      items.push({...nx, nouveau:true});
      arrived++;
      liveIdx = nx.page;
      render({queueOnly:true});
    }, 3200);
    render(); return;
  }

  if(next==="interrompu"){ items = clone(PARTIAL); recaler(null); render(); return; }

  items = clone(F);
  let vise = null;
  if(next==="recurrent"){ onlyTodo=true;  vise = visible().find(f=>f.runs.length>=3 && f.statut==="a_juger"); }
  if(next==="bruit"){     onlyTodo=false; vise = visible().find(f=>f.statut==="bruit"); }
  if(next==="exporte"){   onlyTodo=false; vise = visible().find(f=>f.statut==="exporte"); }
  recaler(vise && vise.id);
  render();
}

/* Thème — au chargement, le CSS décide seul via prefers-color-scheme :
   aucune marque n'est posée sur la racine, donc aucun flash, et un hôte
   qui impose déjà un thème est respecté. Le bouton prend la main ensuite. */
function currentTheme(){
  const stamped = document.documentElement.dataset.theme;
  if(stamped) return stamped;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function syncThemeLabel(){
  $("#theme-lbl").textContent = currentTheme()==="dark" ? "Clair" : "Sombre";
}
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  syncThemeLabel();
}
$("#theme-btn").onclick = ()=>applyTheme(currentTheme()==="dark"?"light":"dark");
$("#help-btn").onclick = ()=>{const h=$("#help"); h.dataset.open = h.dataset.open==="true"?"false":"true"};
$("#help").onclick = e=>{ if(e.target===$("#help")) $("#help").dataset.open="false"; };
$("#help-close").onclick = ()=>{ $("#help").dataset.open="false"; };
function trapHelp(e){
  e.preventDefault();
  $("#help-close").focus();
}

syncThemeLabel();
if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeLabel);
setState("recurrent");
</script>
